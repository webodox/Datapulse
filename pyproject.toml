[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datapulse"
version = "0.1.0"
description = "AI data-quality agent: an ML drift model and a Claude triage agent catch data changes before they break dashboards and models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "typer>=0.9",
  "pandas>=1.5",
  "numpy>=1.22",
  "pyarrow>=12",
  "pyyaml>=6",
  "rich>=13",
  "scikit-learn>=1.2",
  "anthropic>=1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.24"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
build = ["pyinstaller>=6"]

[project.scripts]
datapulse = "datapulse.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
