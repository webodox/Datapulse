# Builds standalone executables (Python bundled) when a GitHub Release is published and attaches them,
# together with their SHA-256 checksums, so any project can use DataPulse without installing Python.
name: release-binaries
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  asset: datapulse-linux-x64 }
          - { os: macos-latest,   asset: datapulse-macos-arm64 }
          - { os: macos-13,       asset: datapulse-macos-x64 }
          - { os: windows-latest, asset: datapulse-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - run: datapulse test
      - run: bash scripts/build_binary.sh
      - name: Smoke-test the executable
        run: |
          exe=$(ls dist/datapulse*)
          "$exe" --version
      - name: Name asset and checksum
        run: |
          exe=$(ls dist/datapulse*)
          cp "$exe" "dist/${{ matrix.asset }}"
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"; else shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}*
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/${{ matrix.asset }} dist/${{ matrix.asset }}.sha256 --clobber
