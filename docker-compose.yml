# Dashboard + API:  docker compose up --build   ->  http://localhost:8080
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATAPULSE_HOME: /data
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      DATAPULSE_SECURE_COOKIES: ${DATAPULSE_SECURE_COOKIES:-}
    volumes:
      - datapulse-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  datapulse-data:
