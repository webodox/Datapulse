# A Go service in a monorepo: run DataPulse from the service directory.
name: CI
on: [pull_request]
permissions: { contents: read, pull-requests: write }
jobs:
  data-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: go test ./...
        working-directory: services/billing
      - uses: your-org/datapulse@v1
        with:
          working-directory: services/billing
          data-file: testdata/invoices.parquet
          setup-python: "false"      # use the runner's python3; leaves the job's tool versions alone
