# A Node.js project: DataPulse needs nothing from your package.json or node_modules.
name: CI
on: [pull_request]
permissions: { contents: read, pull-requests: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci && npm test
  data-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: your-org/datapulse@v1
        with:
          data-file: fixtures/users.csv
